<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Student registration | Northstar School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-6xl items-center justify-center px-6 py-12">
    <section class="w-full max-w-lg">
      <a class="mb-9 inline-flex items-center gap-3 font-semibold tracking-wide" href="index.html">
        <span class="grid h-10 w-10 place-items-center rounded-xl bg-indigo-500 text-lg font-black">N</span>
        NORTHSTAR SCHOOL
      </a>
      <p class="text-sm font-semibold uppercase tracking-[.2em] text-indigo-300">Student enrollment</p>
      <h1 class="mt-3 text-3xl font-bold">Create your student account</h1>
      <p class="mt-2 text-slate-400">Your account will be created with the student role.</p>
      <div id="form-message" class="mt-6 hidden rounded-xl border px-4 py-3 text-sm" role="status" aria-live="polite"></div>
      <form class="mt-7 space-y-5" action="register.php" method="post" data-register-form>
        <input type="hidden" name="csrf_token" data-csrf-token>
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-slate-200">Full name</span>
          <input class="form-input" type="text" name="full_name" autocomplete="name" minlength="2" maxlength="120" required>
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-slate-200">Email address</span>
          <input class="form-input" type="email" name="email" autocomplete="email" maxlength="190" required>
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-slate-200">Password</span>
          <input class="form-input" type="password" name="password" autocomplete="new-password" minlength="10" required>
          <span class="mt-2 block text-xs text-slate-500">Use at least 10 characters.</span>
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-slate-200">Confirm password</span>
          <input class="form-input" type="password" name="confirm_password" autocomplete="new-password" minlength="10" required>
        </label>
        <button class="primary-button w-full" type="submit">Create student account</button>
      </form>
      <p class="mt-7 text-center text-sm text-slate-400">Already registered? <a class="font-semibold text-indigo-300 hover:text-indigo-200" href="index.html">Sign in</a></p>
    </section>
  </main>
  <script src="assets/js/script.js" defer></script>
</body>
</html>
